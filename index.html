<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Frame, crop and save a square photo on your device.">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<link rel="icon" href="data:,">
<title>Frame Studio</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--ink:#25241f;--muted:#635f56;--paper:#f7f5ef;--rule:#c7c3b8}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Helvetica Neue",Arial,sans-serif}
main{max-width:1080px;padding:40px 38px;margin:auto}
header{border-top:3px solid var(--ink);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:14px;padding:19px 0;margin-bottom:26px}
h1{font:500 clamp(35px,5.8vw,65px)/1 Georgia,serif;letter-spacing:-.055em;margin:0}
.mark{width:38px;height:38px;background:var(--ink);display:grid;place-items:center;transform:rotate(-5deg)}
.mark::before{content:"";width:18px;height:18px;border:3px solid #ffc68f}
.editor{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:clamp(22px,5vw,72px);align-items:start}
figure{margin:0;min-width:0}
.board{border:1px solid var(--rule);padding:clamp(14px,2.5vw,32px);background:repeating-linear-gradient(135deg,#e9e5db 0 1px,#edeae2 1px 5px)}
.board.over{outline:3px solid #a74729}
canvas{width:100%;height:auto;display:block;cursor:grab;touch-action:none;box-shadow:0 2px 14px #27211720;aspect-ratio:1}
canvas:active{cursor:grabbing}
figcaption{display:flex;justify-content:space-between;gap:10px;color:var(--muted);margin-top:10px;font-size:13px}
h2{margin:0 0 11px;font:500 25px/1.2 Georgia,serif;letter-spacing:-.035em}
section+section,.export{margin-top:21px;padding-top:17px;border-top:1px solid var(--rule)}
button,.upload{font-family:inherit;line-height:1.2;font-size:15px;font-weight:600;color:var(--ink);background:transparent;border:1px solid #8c897e;border-radius:4px;cursor:pointer;display:inline-flex;justify-content:center;align-items:center;padding:10px 14px;min-height:42px}
button:hover,.upload:hover{background:#e7e3d9}
button:focus-visible,input:focus-visible,canvas:focus-visible,.upload:focus-within{outline:3px solid #9a4327;outline-offset:3px}
.upload{position:relative;overflow:hidden;background:#fffdf7}
.upload input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.note,#status{font-size:14px;color:var(--muted);margin:9px 0 0}
.choices,.actions{display:flex;flex-wrap:wrap;gap:8px}
.choice{gap:9px;min-width:83px}
.choice[aria-pressed=true]{background:#e6e2d6;border-color:#37362f;box-shadow:inset 0 0 0 1px #37362f}
.swatch{width:17px;height:17px;background:#eea35f;border:3px solid #fff5df;outline:1px solid #7c7466}
.orbit{background:#b6cfbd;border-color:#253843;border-radius:50%}
.scale{display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;min-width:0;accent-color:#3a5147}
output{font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.text{padding:4px 0;min-height:30px;display:inline-block;border:0;text-decoration:underline;text-underline-offset:3px;font-size:14px;background:none}
.primary{background:var(--ink);color:#fffdf5;border-color:var(--ink)}
.primary:hover{background:#424139}
[hidden]{display:none}
@media(max-width:680px){main{padding:16px}header{margin-bottom:16px}.editor{grid-template-columns:1fr;gap:20px}section+section,.export{margin-top:15px;padding-top:14px}.board{padding:14px}h2{font-size:23px}}
</style>
</head>
<body><main>
<header><span class="mark" aria-hidden="true"></span><h1>Frame Studio</h1></header>
<div class="editor"><figure>
<div class="board" id="board"><canvas id="cv" width="833" height="833" tabindex="0" aria-label="Framed photo preview. Drag or use the arrow keys to move the photo."></canvas></div>
<figcaption><span id="source">Sample artwork</span><span>833 × 833 px</span></figcaption>
</figure><div>
<section><h2>Photo</h2>
<label class="upload">Choose a photo<input type="file" accept="image/jpeg,image/png,image/webp" aria-label="Choose a photo"></label>
<button type="button" id="sample" class="text" hidden>Use sample</button>
<p class="note">Choose or drop a JPG, PNG or WebP. Your photo stays on this device.</p></section>
<section><h2>Frame</h2><div class="choices" role="group" aria-label="Frame style">
<button type="button" class="choice" data-frame="mat" aria-pressed="true"><i class="swatch" aria-hidden="true"></i>Mat</button>
<button type="button" class="choice" data-frame="orbit" aria-pressed="false"><i class="swatch orbit" aria-hidden="true"></i>Orbit</button></div></section>
<section><h2>Crop</h2><div class="scale"><label for="zoom">Zoom</label><input id="zoom" type="range" min="50" max="300" step="5" value="100"><output for="zoom">100%</output></div>
<p class="note">Drag to reposition. Scroll or pinch to zoom.</p>
<button type="button" class="text" id="reset">Reset crop</button></section>
<div class="export"><div class="actions"><button type="button" class="primary" id="save">Download PNG</button><button type="button" id="share">Share image</button></div>
<p id="status" role="status" aria-live="polite"></p></div>
</div></div></main>
<script>
'use strict';
const $ = selector => document.querySelector(selector);
const canvas = $('#cv'), ctx = canvas.getContext('2d', {willReadFrequently:true});
const side = canvas.width;
const zoom = $('#zoom'), input = $('input[type=file]');
const points = new Map();
let frame = 'mat', photo, fit, x, y, scale, loadVersion = 0;

function sampleArtwork() {
  const art = document.createElement('canvas');
  art.width = art.height = side;
  const pen = art.getContext('2d');
  pen.fillStyle = '#e9ab78';
  pen.fillRect(0, 0, side, side);
  pen.fillStyle = '#ffd89a';
  pen.beginPath(); pen.arc(518, 275, 127, 0, 2*Math.PI); pen.fill();
  function hill(color, start, controlA, controlB, end) {
    pen.beginPath(); pen.moveTo(0, side); pen.lineTo(0, start);
    pen.bezierCurveTo(...controlA, ...controlB, side, end);
    pen.lineTo(side, side); pen.closePath(); pen.fillStyle = color; pen.fill();
  }
  hill('#b65c48', 551, [280, 595], [535, 207], 326);
  hill('#364f4b', 373, [250, 316], [460, 727], 565);
  hill('#203838', 627, [340, 735], [580, 492], 495);
  return art;
}
const sample = sampleArtwork();
function render() {
  ctx.fillStyle = '#e8e2d5'; ctx.fillRect(0, 0, side, side);
  ctx.drawImage(photo, x, y, photo.width*fit*scale, photo.height*fit*scale);
  if (frame === 'mat') {
    ctx.strokeStyle = '#fff2d9'; ctx.lineWidth = 74; ctx.strokeRect(0,0,side,side);
    ctx.lineWidth = 2; ctx.strokeStyle = '#9e8663'; ctx.strokeRect(21,21,side-42,side-42);
  } else {
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,side,side);
    ctx.arc(side/2,side/2,side/2-34,0,Math.PI*2);
    ctx.fillStyle = '#253843'; ctx.fill('evenodd'); ctx.restore();
    ctx.beginPath(); ctx.arc(side/2,side/2,side/2-20,0,Math.PI*2);
    ctx.strokeStyle = '#b6cfbd'; ctx.lineWidth = 4; ctx.stroke();
  }
}
function resetCrop() {
  fit = Math.max(side/photo.width, side/photo.height);
  scale = 1; x = (side-photo.width*fit)/2; y = (side-photo.height*fit)/2;
  zoom.value = '100'; $('output').textContent = '100%'; render();
}
function setZoom(percent) {
  const next = Math.min(300,Math.max(50,Math.round(percent/5)*5))/100;
  x = side/2 + (x-side/2)*next/scale;
  y = side/2 + (y-side/2)*next/scale;
  scale = next; zoom.value = Math.round(next*100);
  $('output').textContent = zoom.value+'%'; render();
}
function message(text) { $('#status').textContent = text; }
function setPhoto(image) {
  photo = image; points.clear(); resetCrop();
  $('#source').textContent = image === sample ? 'Sample artwork' : 'Your photo';
  $('#sample').hidden = image === sample;
}
$('#sample').onclick = () => { loadVersion++; setPhoto(sample); message(''); };
$('#reset').onclick = () => { resetCrop(); message(''); };
zoom.oninput = () => setZoom(Number(zoom.value));
for (const choice of document.querySelectorAll('[data-frame]')) {
  choice.onclick = () => {
    frame = choice.dataset.frame;
    for (const button of document.querySelectorAll('[data-frame]')) {
      button.setAttribute('aria-pressed', String(button === choice));
    }
    render(); message('');
  };
}
async function loadPhoto(file) {
  if (!file) return;
  const version = ++loadVersion;
  if (!['image/jpeg','image/png','image/webp'].includes(file.type)) {
    message('Choose a JPG, PNG or WebP image.'); return;
  }
  const image = new Image();
  try {
    const data = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
    if (version !== loadVersion) return;
    image.src = data; await image.decode();
    if (version === loadVersion) { setPhoto(image); message('Photo ready.'); }
  } catch {
    if (version === loadVersion) message('Could not open that image. Choose another file.');
  }
}
input.onchange = () => { const file = input.files[0]; input.value=''; loadPhoto(file); };
const board = $('#board');
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault(); board.classList.remove('over'); loadPhoto(e.dataTransfer.files[0]);
});
board.ondragover = () => board.classList.add('over');
board.ondragleave = () => board.classList.remove('over');
function distance() {
  const [a,b] = points.values(); return Math.hypot(a.x-b.x,a.y-b.y);
}
canvas.onpointerdown = e => {
  if (e.button !== 0) return;
  canvas.setPointerCapture(e.pointerId);
  points.set(e.pointerId, {x:e.clientX, y:e.clientY});
};
let pinchStart = 0, pinchScale = 1;
canvas.addEventListener('pointerdown', () => {
  if (points.size === 2) { pinchStart = distance(); pinchScale = scale; }
});
canvas.onpointermove = e => {
  const last = points.get(e.pointerId);
  if (!last) return;
  points.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (points.size === 1) {
    const ratio = side/canvas.getBoundingClientRect().width;
    x += (e.clientX-last.x)*ratio; y += (e.clientY-last.y)*ratio; render();
  } else if (points.size === 2 && pinchStart > 0) {
    setZoom(100*pinchScale*distance()/pinchStart);
  }
};
canvas.onlostpointercapture = e => points.delete(e.pointerId);
canvas.onwheel = e => { e.preventDefault(); setZoom(scale*100 + (e.deltaY<0 ? 5 : -5)); };
canvas.onkeydown = e => {
  const offset = {ArrowUp:[0,-8], ArrowDown:[0,8], ArrowLeft:[-8,0], ArrowRight:[8,0]}[e.key];
  if (offset) { e.preventDefault(); x+=offset[0]; y+=offset[1]; render(); }
};
function exportFile() {
  // Keep the share call in the click event so the native picker retains user activation.
  const raw = atob(canvas.toDataURL('image/png').split(',')[1]);
  return new File([Uint8Array.from(raw, c=>c.charCodeAt(0))], 'framed-photo.png', {type:'image/png'});
}
function download(file) {
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
$('#save').onclick = () => { download(exportFile()); message('PNG ready in your downloads.'); };
$('#share').onclick = async () => {
  const file = exportFile();
  const payload = {files:[file], title:'Framed photo'};
  try {
    if (navigator.share && navigator.canShare?.(payload)) {
      await navigator.share(payload); message('Image shared.'); return;
    }
  } catch (error) {
    if (error.name === 'AbortError') { message('Sharing cancelled.'); return; }
  }
  download(file); message('PNG downloaded. Attach it in your preferred app.');
};
setPhoto(sample);
</script></body></html>
